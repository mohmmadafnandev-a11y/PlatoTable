<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a13524" />
    <meta name="description" content="Digital restaurant menu" />
    <!-- These were missing entirely, so browsers fell back to their own
         placeholder globe. Two sizes cover the tab and high-DPI tabs, and iOS
         gets an opaque copy because it composites transparent icons on black. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The brand is fixed, so it is written here rather than read from an
         environment variable. A build-time placeholder that nobody sets renders
         as the literal text `%VITE_APP_NAME%` — and one that is set wrongly does
         the same in a browser tab, which is the first thing anyone reads. -->
    <title>Plato Table — Digital Menu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
